# Render blueprint: New + > Blueprint > pick this repo.
# Optional extra env var (add in the dashboard): OPEN_METEO_API_KEY for higher
# weather API rate limits.
services:
  - type: web
    name: routecast
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
